<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Study</title>
<style>
:root {
  --bg: #fafafa;
  --fg: #111111;
  --font-body: "Inter", -apple-system, system-ui, sans-serif;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  font-family: var(--font-body);
}

.gallery {
  display: flex;
  flex-direction: column;
  width: 100%;
}

.gallery > * {
  opacity: 0;
  transform: translateY(24px);
  animation: fadeUp 600ms var(--ease-standard) forwards;
}

.gallery > :nth-child(1) { animation-delay: 100ms; }
.gallery > :nth-child(2) { animation-delay: 200ms; }
.gallery > :nth-child(3) { animation-delay: 300ms; }
.gallery > :nth-child(4) { animation-delay: 400ms; }
.gallery > :nth-child(5) { animation-delay: 500ms; }
.gallery > :nth-child(6) { animation-delay: 600ms; }
.gallery > :nth-child(7) { animation-delay: 700ms; }
.gallery > :nth-child(8) { animation-delay: 800ms; }
.gallery > :nth-child(9) { animation-delay: 900ms; }
.gallery > :nth-child(10) { animation-delay: 1000ms; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.img-wrap {
  position: relative;
  width: 100%;
  line-height: 0;
}

.img-wrap img {
  display: block;
  width: 100%;
  height: auto;
}

.gallery > img {
  display: block;
  width: 100%;
  height: auto;
}

.tag-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 60px 36px 28px;
  background: linear-gradient(transparent 0%, rgba(0,0,0,0.45) 40%, rgba(0,0,0,0.82) 100%);
  pointer-events: none;
}

.tag-name {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
  margin-bottom: 14px;
  position: relative;
  padding-left: 14px;
}

.tag-name::before {
  content: '';
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 3px;
  background: #2F6FEB;
  border-radius: 2px;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding-left: 14px;
}

.tag {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,255,255,0.08);
  letter-spacing: 0.025em;
  text-transform: uppercase;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  transition: background 200ms ease;
}



.video-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  width: 100%;
  background: #000;
}

.video-pair video {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
}

</style>
</head>
